name: Production Build (main → App Store + Google Play)

# Starts the EAS builds and returns: EAS builds both platforms in the cloud
# and submits each one when it finishes (--auto-submit uses the "production"
# submit profile in eas.json). Previously each build was awaited here and then
# `eas submit --latest` picked "the latest build", which isn't necessarily the
# one this push produced.
#
# The app's settings come from the EAS "production" environment (eas.json):
# EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set
# there (expo.dev → project → Environment variables).

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-production:
    if: github.ref_name == 'main'
    name: EAS Build Production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # eas reads app.config.js, which needs the project's packages.
      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit (iOS + Android)
        run: eas build --platform all --profile production --non-interactive --no-wait --auto-submit
