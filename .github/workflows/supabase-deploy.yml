name: Supabase deploy (dev → preview, main → production)

# Deploys the backend in supabase/ to the project of the branch, same flow as
# the app builds: dev → preview, main → production.
#   1. Migrations: `supabase db push` only runs the ones the database hasn't
#      applied yet.
#   2. Edge Functions: every function in supabase/functions, with the settings
#      in supabase/config.toml (e.g. purge-receipts without JWT check).
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN            personal token from supabase.com/dashboard/account/tokens
#   SUPABASE_PREVIEW_PROJECT_ID      preview project ref (the subdomain of its URL)
#   SUPABASE_PREVIEW_DB_PASSWORD     preview database password
#   SUPABASE_PRODUCTION_PROJECT_ID   production project ref
#   SUPABASE_PRODUCTION_DB_PASSWORD  production database password
#
# Function secrets (CRON_SECRET) live in each Supabase project, set once with
# `supabase secrets set` (see supabase/README.md); deploys don't touch them.

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

# Never run two deploys against the same project at once.
concurrency:
  group: supabase-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  preview:
    name: Deploy to preview
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PREVIEW_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PREVIEW_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"

  production:
    name: Deploy to production
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_ID"
