name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

  typescript:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - run: npx tsc --noEmit

  # Not after `typescript`: a type error shouldn't hide lint results.
  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npx expo lint

  # Supabase Edge Functions (Deno): type-check them as the edge runtime would.
  edgeFunctions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The app's package.json at the repo root would make Deno look for npm
      # packages in node_modules/ (not installed in this job). Edge Functions
      # import with npm: specifiers into Deno's own cache instead.
      - run: deno check supabase/functions/*/index.ts
        env:
          DENO_NO_PACKAGE_JSON: "1"

  expoDoctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true
